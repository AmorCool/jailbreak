name: build_roothide3

on:
  push:
    tags:
      - 'rh3*'
  workflow_dispatch:

permissions:
  contents: write

env:
  VERSION: ${{ github.ref_name }}
  BUNDLEID: 'com.zqbb.Dopamine'

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Xcode Setup
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Checkout
        uses: actions/checkout@main
        with:
            submodules: recursive

      - name: Install Procursus
        uses: dhinakg/procursus-action@main
        with:
          packages: ldid findutils sed coreutils make

      - name: Install better GNU Make
        run: |
          brew install make
          echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

      - name: Install THEOS
        run: |
          set -x
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          mkdir -p $THEOS
          curl -fsSL https://raw.githubusercontent.com/roothide/theos/master/bin/install-theos >> install-theos.sh
          gsed -E "/^\s*get_theos\s*$/,+1 s/^(\s*)(get_sdks)\s*$/\1mkdir -p \${THEOS}\/sdks\n\1touch \${THEOS}\/sdks\/sdk\n\1\2/g" -i install-theos.sh
          bash install-theos.sh
          curl -L https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz --output $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          gunzip $THEOS/sdks/iPhoneOS16.5.sdk.tar.xz
          tar -xf $THEOS/sdks/iPhoneOS16.5.sdk.tar -C $THEOS/sdks
          rm $THEOS/sdks/iPhoneOS16.5.sdk.tar
          cd $BASEDIR

      - name: Build and Install trustcache
        run: |
          set -x
          git clone https://github.com/CRKatri/trustcache
          cd trustcache
          export CFLAGS="$CFLAGS -I$(brew --prefix openssl)/include -arch arm64"
          export LDFLAGS="$LDFLAGS -L$(brew --prefix openssl)/lib -arch arm64"
          gmake -j$(sysctl -n hw.logicalcpu) OPENSSL=1
          sudo cp trustcache /opt/procursus/bin/

      - name: Install libarchive
        run: |
          brew install libarchive

      - name: Pre Bundleid
        run: |
          sed -i '' "s/com.opa334.Dopamine/${{ env.BUNDLEID }}/g" ./Application/Dopamine/Jailbreak/DOPreferenceManager.m
          sed -i '' "s/com.opa334.Dopamine/${{ env.BUNDLEID }}/g" ./Application/Dopamine.xcodeproj/project.pbxproj
          sed -i '' "s/com.opa334.Dopamine/${{ env.BUNDLEID }}/g" ./BaseBin/jbctl/src/main.m

      - name: Pre Version
        run: |
          set -x
          # 版本号跟随上游 opa334/Dopamine 3.x（权威来源：basebin/.version，当前 3.0.1）
          upstream_version=$(curl -fsSL "https://raw.githubusercontent.com/opa334/Dopamine/3.x/BaseBin/_external/basebin/.version" 2>/dev/null | tr -d '[:space:]')
          if [ -z "$upstream_version" ]; then
            upstream_version=$(cat ./BaseBin/_external/basebin/.version 2>/dev/null | tr -d '[:space:]')
          fi
          echo "upstream_version=$upstream_version"
          sed -i '' "s/MARKETING_VERSION = .*;/MARKETING_VERSION = $upstream_version;/g" ./Application/Dopamine.xcodeproj/project.pbxproj
          echo "newVERSION=$upstream_version" >> $GITHUB_ENV

      - name: Pre env
        run: |
          sT=$(TZ=UTC-8 date +'%S')
          echo "msT=$(TZ=UTC-8 date -j -f "%Y-%m-%d %H:%M:%S" "$(TZ=UTC-8 date +'%Y-%m-%d %H:%M'):${sT}" +%s)" >> $GITHUB_ENV
          echo "shT=$(TZ=UTC-8 date +'%Y.%m.%d/%H.%M').${sT}" >> $GITHUB_ENV
          echo "logT=$(TZ=UTC-8 date +'%Y年%m月%d %H:%M'):${sT}" >> $GITHUB_ENV
          echo "SHASH=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
          echo "commitCount=$(curl -s "https://api.github.com/repos/opa334/Dopamine/commits?per_page=1" -I | grep -i 'link' | sed -n 's/.*page=\([0-9]*\)>; rel="last".*/\1/p')" >> $GITHUB_ENV

      - name: Log env
        run: |
          echo ${{ env.newVERSION }}
          echo ${{ env.msT }}
          echo ${{ env.shT }}
          echo ${{ env.logT }}
          echo ${{ env.SHASH }}
          echo ${{ env.commitCount }}

      - name: Pre code
        run: |
          sed -i '' "s/AAAA/${{ env.newVERSION }}  ${{ env.commitCount }}  ${{ env.msT }}/g" ./Application/Dopamine/UI/DOMainViewController.m
          sed -i '' "s/AAAB/不要为了升级而放弃越狱的乐趣~/g" ./Application/Dopamine/UI/DOMainViewController.m
          sed -i '' "s/opa334/w2599/g" ./Application/Dopamine/UI/Settings/DOCreditsViewController.m
          sed -i '' "s/opa334/w2599/g" ./Application/Dopamine/UI/Update/DOUpdateViewController.m
          sed -i '' "s/opa334/w2599/g" ./Application/Dopamine/UI/DOUIManager.m

      - name: Pre Bootstraps
        run: |
          cd Application/Dopamine/Resources
          ./download_bootstraps.sh

      - name: Pre Fix
        run: |
          sed -i '' 's/\/include/\/include -I..\/.include/g' BaseBin/XPF/Makefile

      - name: Build tipa
        run: |
          export BASEDIR="$(pwd)"
          export THEOS="${BASEDIR}/theos"
          # xpc_connection_get_pid 在 iOS 上符号真实存在但头文件标 API_UNAVAILABLE(ios)（硬性 error，无法用 -Wno 关闭）。
          # rh2 的做法是删整个 xpc 头，但那会破坏 3.x jbserver.c 需要的 xpc_dictionary_copy/set_mach_send 声明。
          # 精确手术：只移除 xpc_connection_get_pid 声明前的 API_UNAVAILABLE 标记（对 Xcode SDK 与 theos SDK 都处理）。
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          for XPC in $SDK/usr/include/xpc/xpc.h $THEOS/sdks/iPhoneOS16.5.sdk/usr/include/xpc/xpc.h; do
            [ -f "$XPC" ] || continue
            echo "=== before: $XPC ==="
            grep -n -B1 -A2 "xpc_connection_get_pid" "$XPC" | head -12
            perl -0pi -e 's/(API_UNAVAILABLE\([^)]*\)\s*\n\s*)(?=pid_t\s*\n?\s*xpc_connection_get_pid\b)//g; s/(pid_t\s*\n?\s*xpc_connection_get_pid\b[^;]*;)\s*\n?\s*API_UNAVAILABLE\([^)]*\)/$1/g;' "$XPC"
            echo "=== after: $XPC ==="
            grep -n -B1 -A2 "xpc_connection_get_pid" "$XPC" | head -12
          done
          gmake -j$(sysctl -n hw.physicalcpu) NIGHTLY=1
          mv Application/Dopamine.tipa Dopamine_roothide_${{ env.newVERSION }}_${{ env.commitCount }}_${{ env.msT }}_${{ env.SHASH }}.tipa

      - name: Upload Latest Artifact
        id: dopamine-latest-upload
        uses: actions/upload-artifact@main
        with:
          name: Dopamine_roothide_Latest
          path: |
            *.tipa

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          name: ${{ env.newVERSION }} (roothide)
          tag_name: ${{ github.ref_name }}
          body_path: body.txt
          prerelease: false
          token: ${{ github.token }}
          files: |
           *.tipa
